name: Build and deploy

on:
  push:
  pull_request:
  # Lets you publish the current branch by hand from the Actions tab.
  workflow_dispatch:

# One deployment at a time; a queued run supersedes the one waiting rather than
# racing it to publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Parses the sample plan and asserts the importer still finds the right
      # signs, so a broken import never reaches the site.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Publish only from the repository's default branch, whatever it is called,
    # or when someone triggers the workflow deliberately.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
