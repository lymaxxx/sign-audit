name: Build macOS app

# Builds the .app and .dmg on GitHub's own Mac machines, so nobody needs Xcode,
# Rust or Node installed to get a working application. Run it from the Actions
# tab and download the result from the run's Artifacts section.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple Silicon
          - target: x86_64-apple-darwin
            label: Intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust builds around 400 crates the first time; caching keeps later runs
      # to a couple of minutes.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test

      - name: Build the app
        run: npm run tauri build -- --target ${{ matrix.target }}

      # An .app is a directory whose executable bit and internal symlinks are
      # load-bearing, and the artifact upload re-zips whatever it is given
      # without preserving either — which produces a bundle macOS reports as
      # "damaged". So nothing is uploaded as a directory: the .dmg goes as it
      # is, and the .app is sealed with ditto, which keeps permissions,
      # symlinks and resource forks intact.
      - name: Collect the build
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out

          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Algach.app" "out/Algach-${{ matrix.target }}.zip"
          cp "$bundle"/dmg/*.dmg out/

          # Prove the archive still holds a runnable binary before shipping it.
          rm -rf verify && mkdir verify
          ditto -x -k "out/Algach-${{ matrix.target }}.zip" verify
          test -x "verify/Algach.app/Contents/MacOS/Algach"
          echo "executable bit survived the round trip"

          ls -la out

      - name: How to open it
        run: |
          cat <<'NOTE'
          The build is unsigned, so macOS quarantines it on download and
          reports it as damaged. Clear the flag after unpacking:

              xattr -dr com.apple.quarantine /Applications/Algach.app

          Right-click and Open no longer offers a way past this on recent
          macOS. Removing the warning for good needs a paid Apple Developer
          account for signing and notarisation.
          NOTE

      - uses: actions/upload-artifact@v4
        with:
          name: Algach-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  single-file:
    name: Single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One HTML file that runs off a disk, for anyone who wants to try the
      # thing without installing a toolchain or waiting for a Mac runner.
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: Algach-single-file
          path: Algach.html
          if-no-files-found: error
